# ============================================
# 공통 설정 (application.yaml)
# 개발/운영 환경별 설정은 application-dev.yaml, application-prod.yaml 참고
# *그 명절 예매용 임시 서버라고 생각하고 짜는중!!
# ============================================
spring:
  application:
    name: train-reservation-service
  profiles:
    default: dev
  
  # 데이터소스 공통 설정
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  
  # JPA 공통 설정
  jpa:
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
    open-in-view: false
  
  # Flyway 설정 (step_final 구현 시 활성화 예정, 현재는 init-data.sql 사용)
  flyway:
    enabled: false
  
  # Redis 공통 설정
  data:
    redis:
      timeout: 2000ms
      lettuce:
        pool:
          max-wait: -1ms
  
  # Kafka 공통 설정
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      compression-type: snappy
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false

# 커스텀 설정 (공통)
queue:
  waiting:
    max-admitted: 100
    check-interval-ms: 1000
  
  token:
    ttl-seconds: 300
    prefix: "token:queue:"
  
  seat:
    hold-ttl-seconds: 180
    lock-prefix: "lock:seat:"
  
  cache:
    seat-availability-ttl-seconds: 10
    train-search-ttl-seconds: 60

# 로깅 공통 설정
logging:
  level:
    root: INFO
    com.shl.trainreservationsjmetertest: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 서버 공통 설정
server:
  port: 8080
  compression:
    enabled: true
